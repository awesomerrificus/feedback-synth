<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electric Mountain Video Synth</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--f:'Barlow Condensed','Arial Narrow',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050505;color:#efefe9;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px max(16px,env(safe-area-inset-left));max-width:520px;margin:0 auto}
h1{margin:0;font-family:var(--f);font-weight:800;font-size:34px;line-height:.95;text-transform:uppercase;background:#8ddc86;color:#111;padding:10px 14px 8px;border-radius:2px}
h1 span{font-weight:300}
p{margin:0;font-family:var(--f);font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:#b4b4ac}
a{display:block;padding:14px 16px;font-family:var(--f);font-weight:700;font-size:18px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:#f1f1ea;background:linear-gradient(#2b2b2b,#141414);border:1px solid #000;border-radius:3px;box-shadow:inset 0 1px 0 #ffffff26,0 2px 0 #000}
a.main{background:radial-gradient(circle at 50% 40%,#f4ffd0,#c9ef8a 70%);color:#111;box-shadow:0 0 12px #d4ff8a99,0 2px 0 #000}
a.back{background:none;border:0;box-shadow:none;padding:4px 0;font-size:14px;color:#8c8c86}
</style>
</head>
<body>
<main>
  <h1>Electric Mountain <span>Video Synth</span></h1>
  <p>Your track turned into visuals that cut and move with the sound. Opening the right version for this device…</p>
  <a id="phone" href="mobile.html?v=20261112c">Phone / tablet version</a>
  <a id="desk" href="desktop.html?v=20261112c">Desktop version</a>
  <a class="back" href="../">All Electric Mountain synths</a>
</main>
<script>
const phone = matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 900;
document.getElementById(phone ? 'phone' : 'desk').classList.add('main');
if (!location.hash) setTimeout(()=>location.replace((phone ? 'mobile.html' : 'desktop.html')+'?v=20261112c'), 600);
</script>
</body>
</html>
