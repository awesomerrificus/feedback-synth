<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electric Mountain Video Synth</title>
<style>
:root{color-scheme:dark;--bg:#0c0d10;--text:#e8e9ec;--dim:#8b909c;--accent:#7cf2c8;--line:#2a2e38}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px max(16px,env(safe-area-inset-left));max-width:520px;margin:0 auto;box-sizing:border-box}
h1{font-size:18px;letter-spacing:.05em;text-transform:uppercase;margin:0}h1 span{color:var(--accent)}
p{color:var(--dim);margin:0}
a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none}
a.main{background:var(--accent);color:#06261b;border-color:var(--accent);font-weight:600}
a.back{border:0;padding:0;color:var(--dim);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Electric Mountain <span>Video Synth</span></h1>
  <p>Your track turned into visuals that cut and move with the sound. Opening the right version for this device…</p>
  <a id="phone" href="mobile.html?v=20261111b">Phone / tablet version</a>
  <a id="desk" href="desktop.html?v=20261111b">Desktop version</a>
  <a class="back" href="../">All Electric Mountain synths</a>
</main>
<script>
const phone = matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 900;
document.getElementById(phone ? 'phone' : 'desk').classList.add('main');
if (!location.hash) setTimeout(()=>location.replace((phone ? 'mobile.html' : 'desktop.html')+'?v=20261111b'), 600);
</script>
</body>
</html>
